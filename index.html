    <title>Web Nav</title>

    <style>

        /* 页面整体 */
        body {
            margin: 0;
            padding: 0;

            background-color: #f5f6fa;

            font-family:
                "Microsoft YaHei",
                "Segoe UI",
                sans-serif;
        }


        /* 页面容器 */
        .container {

            max-width: 800px;

            margin: 100px auto;

            text-align: center;

			align-items: center;

        }


        /* 标题 */
        h1 {

            color: #333;

            font-size: 32px;

            margin-bottom: 40px;

        }


        /* 网站链接区域 */
        .links {
            display: flex;
     		flex-wrap: wrap;
            gap: 20px;
 			justify-content: center;
        }


        /* 网站按钮 */
        .links a {
            display: block;
			width: 160px;
			flex-shrink: 0;
    		padding: 15px 0;
			box-sizing: border-box;
   			text-align: center;
			border: 1px solid #d0d0d0;
            background-color: f5f5f5;
            color: #5079d9;
            text-decoration: none;
            font-size: 20px;
            border-radius: 8px;
            box-shadow:
                0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }


        /* 鼠标悬停效果 */
        .links a:hover {

   		background: -webkit-gradient(linear,left top,left bottom,from(#fcfcfc),to(#f5f5f5));
    	background: linear-gradient(#fcfcfc,#f5f5f5);


       transform: translateY(0px);
        }
    </style>

</head>
